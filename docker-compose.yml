# Banco PostgreSQL para desenvolvimento local:   docker compose up -d db
# Aplicação completa (publicação/teste de produção): docker compose --profile app up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsc
      POSTGRES_PASSWORD: bsc
      POSTGRES_DB: bsc
    ports: ["5432:5432"]
    volumes: [bscdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsc -d bsc"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://bsc:bsc@db:5432/bsc
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (openssl rand -hex 48)}
      NODE_ENV: production
      PORT: 3000
      TZ: America/Sao_Paulo
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-Trocar@123}
    volumes: [bscfiles:/data/storage]
    ports: ["3000:3000"]

volumes:
  bscdata:
  bscfiles:
